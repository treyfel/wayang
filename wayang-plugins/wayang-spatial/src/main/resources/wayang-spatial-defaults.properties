# Load profiles of the spatial execution operators.
#
# NB: Not measured. These are first guesses whose *shape* reflects the algorithms
# (index build/probe, refinement per candidate pair, Sedona partitioning and shuffles);
# the constants should be calibrated, e.g., with the wayang-profiler GeneticOptimizerApp
# against the *.load.template entries. All CPU values are in cycles; geometry predicates
# (JTS/GEOS) are assumed to cost a few microseconds each, i.e., orders of magnitude more
# than a plain filter UDF.

# --- Java ---------------------------------------------------------------------------------

wayang.java.spatialfilter.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0 + ?",\
  "ram":"?"\
}
wayang.java.spatialfilter.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"8000*in0 + 350000",\
  "ram":"100000",\
  "p":0.5\
}

# STRtree over input 1, envelope probe per element of input 0, exact predicate per match.
wayang.java.spatialjoin.load.template = {\
  "type":"mathex", "in":2, "out":1,\
  "cpu":"?*in1*ln(in1 + 2) + ?*in0*ln(in1 + 2) + ?*out0 + ?",\
  "ram":"?*in1"\
}
wayang.java.spatialjoin.load = {\
  "type":"mathex", "in":2, "out":1,\
  "cpu":"3000*in1*ln(in1 + 2) + 2000*in0*ln(in1 + 2) + 20000*out0 + 1000000",\
  "ram":"400*in1",\
  "p":0.5\
}

# Jackson parsing plus WKT/GeoJSON-to-JTS conversion per feature.
wayang.java.geojsonfilesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"?*out0"\
}
wayang.java.geojsonfilesource.load = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"20000*out0 + 1400000",\
  "ram":"1000*out0",\
  "p":0.5\
}

wayang.java.geojsonfilesink.load.template = {\
  "type":"mathex", "in":1, "out":0,\
  "cpu":"?*in0 + ?",\
  "ram":"0",\
  "disk":"?*in0"\
}
wayang.java.geojsonfilesink.load = {\
  "type":"mathex", "in":1, "out":0,\
  "cpu":"10000*in0 + 810000",\
  "ram":"0",\
  "disk":"500*in0",\
  "p":0.5\
}

# kNN scan: key extraction and an envelope check per element, an exact distance and a heap
# update only for candidates that can enter the current k nearest (~k ln(n/k) for random order).
wayang.java.spatialknnsearch.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0 + ?*out0*ln(in0 + 2) + ?",\
  "ram":"?*out0"\
}
wayang.java.spatialknnsearch.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"5000*in0 + 20000*out0*ln(in0 + 2) + 500000",\
  "ram":"100*out0",\
  "p":0.5\
}

# STRtree build over all elements.
wayang.java.spatialindex.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0*ln(in0 + 2) + ?",\
  "ram":"?*in0"\
}
wayang.java.spatialindex.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"3000*in0*ln(in0 + 2) + 500000",\
  "ram":"400*in0",\
  "p":0.5\
}

# Nearest-first walk of each index (in0 = number of indexes, not elements), then a merge.
wayang.java.spatialindexknnsearch.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0 + ?*out0*ln(out0 + 2) + ?",\
  "ram":"?*out0"\
}
wayang.java.spatialindexknnsearch.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"100000*in0 + 20000*out0*ln(out0 + 2) + 100000",\
  "ram":"100*out0",\
  "p":0.5\
}

# --- Spark (Sedona) -------------------------------------------------------------------------

# SpatialRDD.analyze() is an extra pass (plus a small collect) before the actual filter.
wayang.spark.spatialfilter.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0 + ?",\
  "ram":"?",\
  "network":"?"\
}
wayang.spark.spatialfilter.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"10000*in0 + 56789",\
  "ram":"10000",\
  "network":"10000",\
  "p":0.5\
}

# analyze() on both sides, sample-based spatial partitioning, shuffle of both inputs,
# per-partition index on input 1, probe with input 0, refinement per match.
wayang.spark.spatialjoin.load.template = {\
  "type":"mathex", "in":2, "out":1,\
  "cpu":"?*(in0 + in1) + ?*in0*ln(in1 + 2) + ?*out0 + ?",\
  "ram":"?*in1",\
  "network":"?*(in0 + in1) + ?*out0 + ?"\
}
wayang.spark.spatialjoin.load = {\
  "type":"mathex", "in":2, "out":1,\
  "cpu":"5000*(in0 + in1) + 1500*in0*ln(in1 + 2) + 20000*out0 + 2000000",\
  "ram":"400*in1",\
  "network":"200*(in0 + in1) + 50*out0 + 430000",\
  "p":0.5\
}

# kNN: R-tree per partition, local kNN per partition, takeOrdered(k) on the driver.
wayang.spark.spatialknnsearch.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*in0*ln(in0 + 2) + ?*out0 + ?",\
  "ram":"?*in0",\
  "network":"?*out0 + ?"\
}
wayang.spark.spatialknnsearch.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"3000*in0*ln(in0 + 2) + 20000*out0 + 2000000",\
  "ram":"400*in0",\
  "network":"1000*out0 + 10000",\
  "p":0.5\
}

# --- Postgres (PostGIS) ---------------------------------------------------------------------

# The ST_* predicates are index-aware: assumes a GiST index on the filtered column, i.e., an index
# lookup plus a GEOS predicate per candidate (approximated by out0). Without such an index, PostGIS
# evaluates the predicate on every row (~in0 instead of ln(in0)); override this key if your tables
# are not indexed.
wayang.postgres.spatialfilter.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*ln(in0 + 2) + ?*out0 + ?",\
  "ram":"0"\
}
wayang.postgres.spatialfilter.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"1500*ln(in0 + 2) + 15000*out0 + 380000",\
  "ram":"0",\
  "p":0.5\
}

# Assumes a GiST index on the joined (input 1) table, i.e., an index nested-loop join.
# Without such an index, PostGIS falls back to in0*in1 predicate evaluations; override
# this key if your tables are not indexed.
wayang.postgres.spatialjoin.load.template = {\
  "type":"mathex", "in":2, "out":1,\
  "cpu":"?*in0*ln(in1 + 2) + ?*out0 + ?",\
  "ram":"0"\
}
wayang.postgres.spatialjoin.load = {\
  "type":"mathex", "in":2, "out":1,\
  "cpu":"1500*in0*ln(in1 + 2) + 15000*out0 + 380000",\
  "ram":"0",\
  "p":0.5\
}

# ORDER BY geom <-> reference LIMIT k: with a GiST index a nearest-first index walk (~ln(in0) + k).
# Without such an index, PostGIS scans all rows (~in0 instead of ln(in0)); override this key then.
wayang.postgres.spatialknnsearch.load.template = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"?*ln(in0 + 2) + ?*out0 + ?",\
  "ram":"0"\
}
wayang.postgres.spatialknnsearch.load = {\
  "type":"mathex", "in":1, "out":1,\
  "cpu":"1500*ln(in0 + 2) + 15000*out0 + 380000",\
  "ram":"0",\
  "p":0.5\
}
